name: Sync Upstream (MC + ACM)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout magic-acm-context
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone upstream repos
        run: |
          git clone --depth=1 --branch master https://github.com/KorenKrita/magic-context.git /tmp/magic-context
          git clone --depth=1 https://github.com/KorenKrita/pi-context.git /tmp/pi-context
          git clone --depth=1 https://github.com/KorenKrita/omp-context.git /tmp/omp-context

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync MC packages
        run: ./scripts/sync-mc.sh /tmp/magic-context

      - name: Sync ACM code
        run: ./scripts/sync-acm.sh /tmp/pi-context /tmp/omp-context

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes to sync."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected:"
            git diff --stat
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "sync: update from upstream (MC + ACM)"
          branch: auto/sync-upstream
          title: "sync: update from upstream (MC + ACM)"
          body: |
            Daily automated sync from upstream repos:
            - [magic-context](https://github.com/KorenKrita/magic-context) `master`
            - [pi-context](https://github.com/KorenKrita/pi-context) `main`
            - [omp-context](https://github.com/KorenKrita/omp-context) `main`

            ACM glue code (import + registration + prompt.ts) is preserved automatically.

            Please verify:
            - [ ] `bun install`
            - [ ] `bun run typecheck`
            - [ ] `bun run test`
          delete-branch: true
