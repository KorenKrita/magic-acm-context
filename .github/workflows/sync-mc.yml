name: Sync Magic Context Upstream

on:
  # Triggered by magic-context repo via repository_dispatch
  repository_dispatch:
    types: [mc-upstream-updated]
  # Manual trigger
  workflow_dispatch:
  # Or schedule daily check
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout magic-acm-context
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone magic-context upstream
        run: |
          git clone --depth=1 --branch master https://github.com/KorenKrita/magic-context.git /tmp/magic-context

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run sync script
        run: ./scripts/sync-mc.sh /tmp/magic-context

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes to sync."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected:"
            git diff --stat
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "sync: update MC packages from magic-context"
          branch: auto/sync-mc
          title: "sync: update MC packages from magic-context"
          body: |
            Automated sync from [magic-context](https://github.com/KorenKrita/magic-context) `feat/omp-adapter` branch.

            ACM glue code (import + registration) has been re-injected automatically.

            Please verify:
            - [ ] `bun install`
            - [ ] `bun run typecheck`
            - [ ] `bun run test`
          delete-branch: true
